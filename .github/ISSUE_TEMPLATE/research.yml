name: Research or technical decision
description: Investigate a ResQPH question and produce an evidence-based recommendation.
title: "[Research] "
labels:
  - "type:research"
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Research tickets must end with a documented conclusion, recommendation, or decision. Collecting links without evaluating them is not sufficient.

  - type: dropdown
    id: phase
    attributes:
      label: Project phase
      options:
        - Phase 1 — Requirements and Data Validation
        - Phase 2 — Core Application
        - Phase 3 — Mapping and Geospatial Pipeline
        - Phase 4 — Routing
        - Phase 5 — AI/ML
        - Phase 6 — Offline Simulation
        - Phase 7 — Integration and Testing
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Research area
      options:
        - Requirements and Scope
        - UI/UX and Frontend
        - Backend API
        - MongoDB and Database
        - Geospatial Data
        - Routing
        - AI/ML
        - Offline Synchronization
        - Testing
        - Documentation
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Research question
      description: State the specific question this ticket must answer.
      placeholder: What decision or uncertainty must be resolved?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why the question matters and which project components depend on the answer.
      placeholder: Describe the project need, constraint, or dependency.
    validations:
      required: true

  - type: input
    id: primary_owner
    attributes:
      label: Proposed primary owner
      placeholder: "@username"
    validations:
      required: true

  - type: input
    id: supporting_contributors
    attributes:
      label: Supporting contributors
      placeholder: "@username, @username"

  - type: textarea
    id: options
    attributes:
      label: Options to investigate
      description: List the technologies, datasets, algorithms, or approaches that should be compared.
      placeholder: |
        1. Option A
        2. Option B
        3. Option C
    validations:
      required: true

  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation criteria
      description: Explain how the options will be evaluated.
      placeholder: |
        - Suitability for the approved project scope
        - Data availability and quality
        - Implementation difficulty
        - Explainability
        - Integration requirements
        - Licensing or usage restrictions
    validations:
      required: true

  - type: textarea
    id: expected_output
    attributes:
      label: Required output
      description: Identify what must be produced before this ticket can be closed.
      placeholder: |
        - Comparison of the investigated options
        - Supporting evidence and source links
        - Recommended option
        - Risks and limitations
        - Documented team decision
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: |
        Depends on #
        Blocks #

  - type: input
    id: decision_deadline
    attributes:
      label: Decision deadline
      description: Enter the date by which the result is needed.
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: checkboxes
    id: completion
    attributes:
      label: Completion requirements
      options:
        - label: The result will include evidence, not only personal preference.
          required: true
        - label: The recommendation will describe risks and limitations.
          required: true
        - label: The final decision will be recorded in the appropriate Markdown document.
          required: true