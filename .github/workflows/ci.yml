name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node --test ../deployment/vercel-config.test.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check app tests --target-version py312
      - run: python -m pytest
      - run: python -m ruff check ../tests/integration --target-version py312
      - run: python -m pytest ../tests/integration
      - run: python -m unittest discover -s ../deployment -p test_release_guard.py

  ml-evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/external-experiments/ondoy-2009-metro-manila
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/external-experiments/ondoy-2009-metro-manila/requirements.txt
            ml/external-experiments/ondoy-2009-metro-manila/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest

  routing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: routing/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m ruff check src tests --target-version py312
      - run: python -m pytest

  mongodb-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_MONGODB_INTEGRATION: "1"
      MONGODB_INTEGRATION_URI: mongodb://localhost:27017/?replicaSet=rs-ci
      MONGODB_INTEGRATION_DATABASE: resqph_issue62_offline_ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: bash .github/scripts/start-ci-mongo.sh
      - run: python -m pip install -r backend/requirements-dev.txt 'networkx>=3.4,<4.0'
      - name: Real transaction, durable assignment, cookie lifecycle, offline and cancellation acceptance
        working-directory: backend
        run: >-
          python -m pytest -ra tests/test_assignment_mongodb.py tests/test_offline_sync_mongodb.py
          tests/test_product_journey_mongodb.py tests/test_citizen_cancellation_mongodb.py
          tests/test_station_distance_mongodb.py
          tests/test_dispatch_restart_mongodb.py

  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENVIRONMENT: development
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs-ci
      MONGODB_DATABASE: resqph_ci_browser_${{ github.run_id }}_${{ github.run_attempt }}
      AUTH_ALLOW_DEMO_HEADERS: "false"
      AUTH_COOKIE_SECURE: "false" # Disposable localhost HTTP only; hosted-cookie tests assert Secure.
      FRONTEND_ORIGINS: http://127.0.0.1:5175
      VITE_API_URL: /api/v1
      ML_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: bash .github/scripts/start-ci-mongo.sh
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Start isolated API and wait for database/dispatch readiness
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 --no-proxy-headers > /tmp/resqph-ci-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'CI API failed readiness' >&2
          exit 1
      - run: npm run test:browser --prefix frontend

  release-gate:
    if: always()
    needs: [frontend, backend, ml-evidence, routing, mongodb-transactions, production-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed (never accept skipped/neutral jobs)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, result in results.items() if result['result'] != 'success']
          if failed:
              raise SystemExit('Release blocked by: ' + ', '.join(failed))
          print('All required verification jobs succeeded')
          PY
