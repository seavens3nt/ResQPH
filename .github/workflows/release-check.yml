name: Release eligibility (no deployment)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full current main commit to verify
        required: true
        type: string
      target:
        description: Environment to verify
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  actions: read

concurrency:
  group: resqph-release-check-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  eligibility:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require current main, complete same-SHA CI and staging acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.target }}
          STAGING_ACCEPTED_SHA: ${{ vars.STAGING_ACCEPTED_SHA }}
        run: python deployment/release_guard.py
