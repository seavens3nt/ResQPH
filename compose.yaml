services:
  mongodb:
    image: mongo:8.0
    container_name: resqph-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - resqph_mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (error) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
          | grep 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  resqph_mongodb_data:
