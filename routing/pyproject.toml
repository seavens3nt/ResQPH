[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resqph-routing"
version = "0.1.0"
description = "U-Belt road graph extraction, flood join, and validation for ResQPH"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
include = ["resqph_routing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"